<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="https://4ever.ai.id/favicon.png">
<meta property="og:site_name" content="4ever.ai.id">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TES SCRAPE — sementara</title>
<style>body{background:#111;color:#eee;font-family:monospace;padding:20px;word-break:break-word}h1{font-size:1.1rem;color:#d4af37}pre{background:#000;padding:12px;border:1px solid #444;border-radius:8px;white-space:pre-wrap}</style>
</head>
<body>
<h1>TES SCRAPE via proxy — sementara, akan dihapus</h1>
<div id="out">⏳ lagi ngetes…</div>
<script>
(async () => {
  const out = document.getElementById('out');
  const lines = [];
  const log = (s) => { lines.push(s); out.innerHTML = '<pre>' + lines.join('\n') + '</pre>'; };
  async function tes(label, targetUrl) {
    log('=== ' + label + ' ===');
    log('target: ' + targetUrl);
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 25000);
      const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl), { signal: ctrl.signal });
      clearTimeout(t);
      log('HTTP STATUS (proxy): ' + res.status);
      const txt = await res.text();
      log('PANJANG HTML: ' + txt.length + ' karakter');
      log('ADA og:video? ' + (txt.indexOf('og:video') !== -1 ? 'YA' : 'TIDAK'));
      log('ADA kata login? ' + (/log in|login/i.test(txt) ? 'YA' : 'TIDAK'));
      log('CUPLIKAN 600 karakter pertama:');
      log(txt.slice(0, 600));
    } catch (e) {
      log('FETCH GAGAL: ' + e.name + ' — ' + e.message);
    }
    log('');
  }
  await tes('1. Halaman embed IG (shortcode contoh)', 'https://www.instagram.com/reel/CxYz123abc/embed/');
  await tes('2. Homepage indown.io', 'https://indown.io/en5');
  log('SELESAI.');
})();
</script>
</body>
</html>
