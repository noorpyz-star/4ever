<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breakout — Game Afis &amp; Dita</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: #ffffff; color: #222; padding-bottom: 40px; }
  .topbar { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid #eee; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .topbar-in { max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:10px 16px; }
  .tb-logo { font-weight:900; font-size:1rem; letter-spacing:.02em; text-decoration:none; background-image:linear-gradient(90deg,#e53935,#f9a825,#43a047); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; flex:none; }
  .topbar nav { margin-left:auto; display:flex; gap:14px; overflow-x:auto; scrollbar-width:none; }
  .topbar nav::-webkit-scrollbar { display:none; }
  .topbar nav a { color:#666; text-decoration:none; font-size:.83rem; font-weight:600; white-space:nowrap; }
  .topbar nav a:hover { color:#111; }
  .topbar nav a.on { color:#e53935; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; text-align: center; }
  .back { display: inline-block; margin: 4px 0 10px; color: #e53935; text-decoration: none; font-weight: 700; font-size: 14px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 14px; }
  .stats { display: flex; justify-content: center; gap: 12px; margin-bottom: 12px; }
  .stat { background: #fff8e1; border: 1px solid #ffe082; border-radius: 12px; padding: 8px 16px; font-size: 14px; }
  .stat b { color: #e53935; font-size: 18px; }
  canvas { background: #fffde7; border: 2px solid #f9a825; border-radius: 14px; width: 100%; max-width: 400px; height: auto; display: block; margin: 0 auto; touch-action: none; cursor: pointer; }
  .btn { font-size: 15px; padding: 11px 20px; border: none; border-radius: 999px; cursor: pointer; font-weight: 700; background: #e53935; color: #fff; margin-top: 12px; }
  #msg { font-size: 17px; font-weight: 700; margin: 12px 0 4px; min-height: 24px; }
  .hint { font-size: 12.5px; color: #888; }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <a class="tb-logo" href="https://4ever.ai.id/">4EVER</a>
  <nav>
    <a href="https://4ever.ai.id/">Beranda</a>
    <a href="https://4ever.ai.id/profil.html">Profil</a>
    <a href="https://4ever.ai.id/musik-yt.html">Musik</a>
    <a href="https://4ever.ai.id/tools.html">Tools</a>
    <a href="https://4ever.ai.id/artikel.html">Artikel</a>
    <a href="https://4ever.ai.id/tv-gratis.html">TV</a>
    <a href="https://4ever.ai.id/berita.html">Berita</a>
    <a href="https://4ever.ai.id/game-hub-afis-dita.html" class="on">Game</a>
  </nav>
</div></div>

<div class="wrap">
  <a class="back" href="game-hub-afis-dita.html">⬅ Kembali ke Hub</a>
  <h1>🧱 Breakout</h1>
  <p class="sub">Gerakkan papan, pantulkan bolanya, hancurkan semua bata. Kamu punya 3 nyawa!</p>
  <div class="stats">
    <div class="stat">Skor<br><b id="skor">0</b></div>
    <div class="stat">Nyawa<br><b id="nyawa">❤️❤️❤️</b></div>
    <div class="stat">Terbaik<br><b id="terbaik">0</b></div>
  </div>
  <canvas id="cv" width="400" height="500"></canvas>
  <div id="msg">Tekan ▶ Mulai untuk main!</div>
  <button class="btn" id="btnMulai">▶ Mulai</button>
  <p class="hint">Geser mouse / jari untuk menggerakkan papan. Keyboard: ← →.</p>
</div>

<script>
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = 400, H = 500;
const WARNA = ["#e53935", "#f9a825", "#43a047", "#0288d1", "#8e24aa"];
let paddle, bola, bata, skor, nyawa, jalan = false, raf = null;
let terbaik = 0;
try { terbaik = parseInt(localStorage.getItem("breakout-terbaik") || "0", 10) || 0; } catch (e) {}
document.getElementById("terbaik").textContent = terbaik;

function buatBata() {
  bata = [];
  for (let r = 0; r < 5; r++) for (let c = 0; c < 8; c++) {
    bata.push({ x: 12 + c * 47, y: 50 + r * 26, w: 42, h: 20, hidup: true, warna: WARNA[r] });
  }
}
function reset() {
  paddle = { x: W / 2 - 45, y: H - 30, w: 90, h: 12 };
  bola = { x: W / 2, y: H - 50, r: 8, dx: 3, dy: -3 };
  buatBata();
  skor = 0; nyawa = 3;
  document.getElementById("skor").textContent = "0";
  document.getElementById("nyawa").textContent = "❤️❤️❤️";
  gambar();
}
function gambar() {
  ctx.fillStyle = "#fffde7"; ctx.fillRect(0, 0, W, H);
  bata.forEach(b => {
    if (!b.hidup) return;
    ctx.fillStyle = b.warna;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill();
  });
  ctx.fillStyle = "#e53935";
  ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6); ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.arc(bola.x, bola.y, bola.r, 0, Math.PI * 2); ctx.fill();
}
function loop() {
  if (!jalan) return;
  bola.x += bola.dx; bola.y += bola.dy;
  if (bola.x - bola.r < 0 || bola.x + bola.r > W) bola.dx = -bola.dx;
  if (bola.y - bola.r < 0) bola.dy = -bola.dy;
  if (bola.y + bola.r > paddle.y && bola.y - bola.r < paddle.y + paddle.h &&
      bola.x > paddle.x && bola.x < paddle.x + paddle.w && bola.dy > 0) {
    bola.dy = -bola.dy;
    const titik = (bola.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    bola.dx = titik * 4;
    bola.y = paddle.y - bola.r;
  }
  bata.forEach(b => {
    if (!b.hidup) return;
    if (bola.x + bola.r > b.x && bola.x - bola.r < b.x + b.w &&
        bola.y + bola.r > b.y && bola.y - bola.r < b.y + b.h) {
      b.hidup = false; bola.dy = -bola.dy; skor += 10;
      document.getElementById("skor").textContent = skor;
    }
  });
  if (bata.every(b => !b.hidup)) { menang(); return; }
  if (bola.y - bola.r > H) {
    nyawa--;
    document.getElementById("nyawa").textContent = "❤️".repeat(Math.max(0, nyawa)) + "🤍".repeat(Math.max(0, 3 - nyawa));
    if (nyawa <= 0) { gameOver(); return; }
    bola = { x: paddle.x + paddle.w / 2, y: H - 50, r: 8, dx: 3, dy: -3 };
    document.getElementById("msg").textContent = "Nyawa berkurang! Sisa " + nyawa + ".";
  }
  gambar();
  raf = requestAnimationFrame(loop);
}
function mulai() {
  cancelAnimationFrame(raf);
  reset();
  jalan = true;
  document.getElementById("msg").textContent = "Ayo hancurkan! 🧱";
  document.getElementById("btnMulai").textContent = "🔄 Main Lagi";
  raf = requestAnimationFrame(loop);
}
function simpanTerbaik() {
  if (skor > terbaik) {
    terbaik = skor;
    document.getElementById("terbaik").textContent = terbaik;
    try { localStorage.setItem("breakout-terbaik", String(terbaik)); } catch (e) {}
    return true;
  }
  return false;
}
function menang() {
  jalan = false; cancelAnimationFrame(raf);
  const rekor = simpanTerbaik();
  document.getElementById("msg").textContent = "🎉 MENANG! Semua bata hancur! Skor " + skor + (rekor ? " — Rekor baru!" : "");
  document.getElementById("btnMulai").textContent = "🔄 Main Lagi";
}
function gameOver() {
  jalan = false; cancelAnimationFrame(raf);
  const rekor = simpanTerbaik();
  document.getElementById("msg").textContent = "💥 Game Over! Skor kamu " + skor + (rekor ? " — Rekor baru! 🎉" : ".");
  document.getElementById("btnMulai").textContent = "🔄 Main Lagi";
}
function gerakPaddle(clientX) {
  const r = cv.getBoundingClientRect();
  const x = (clientX - r.left) * (W / r.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  if (!jalan) gambar();
}
cv.addEventListener("pointermove", e => gerakPaddle(e.clientX));
cv.addEventListener("pointerdown", e => gerakPaddle(e.clientX));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { paddle.x = Math.max(0, paddle.x - 18); if (!jalan) gambar(); e.preventDefault(); }
  if (e.key === "ArrowRight") { paddle.x = Math.min(W - paddle.w, paddle.x + 18); if (!jalan) gambar(); e.preventDefault(); }
});
document.getElementById("btnMulai").onclick = mulai;
reset();
</script>
</body>
</html>
