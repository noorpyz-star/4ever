<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>4ever Musik — Putar Musik Gratis Tanpa Iklan</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(circle at 50% 8%, #181818 0%, #000 60%, #000 100%);
    color:#eee; min-height:100vh; text-align:center; padding:26px 16px 170px;
  }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { color:#fff; font-size:1.55rem; }
  .sub { color:#d4af37; letter-spacing:2px; font-size:.78rem; margin-top:5px; }
  .note { color:#999; font-size:.85rem; margin-top:10px; line-height:1.55; }
  .search { display:flex; gap:8px; margin-top:20px; }
  .search input { flex:1; padding:13px 14px; border-radius:11px; border:1px solid #555; background:#101010; color:#fff; font-size:1rem; font-family:inherit; }
  .btn { padding:13px 18px; border:none; border-radius:11px; background:linear-gradient(90deg,#d4af37,#f5e08c); color:#111; font-size:.98rem; font-weight:bold; font-family:inherit; cursor:pointer; }
  .btn.ghost { background:transparent; border:1px solid #d4af37; color:#fff; }
  .tabs { display:flex; gap:8px; margin-top:18px; }
  .tab { flex:1; padding:11px 4px; border-radius:10px; border:1px solid #444; background:#0b0b0b; color:#ccc; font-family:inherit; font-size:.92rem; cursor:pointer; }
  .tab.on { border-color:#d4af37; color:#f5e08c; font-weight:bold; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  .chip { padding:10px 14px; border-radius:20px; border:1px solid #444; background:#0b0b0b; color:#ccc; font-family:inherit; font-size:.88rem; cursor:pointer; }
  .chip.on { border-color:#d4af37; color:#f5e08c; font-weight:bold; }
  .sec-title { text-align:left; color:#fff; font-size:1.05rem; margin:22px 0 10px; }
  .track { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#0b0b0b; border:1px solid #2c2c2c; border-radius:13px; padding:9px 11px; margin-top:9px; cursor:pointer; font-family:inherit; color:#eee; }
  .track.playing { border-color:#d4af37; }
  .track img { width:52px; height:52px; border-radius:9px; object-fit:cover; flex:none; background:#222; }
  .track .meta { flex:1; min-width:0; }
  .track .tt { color:#fff; font-weight:bold; font-size:.96rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track .ar { color:#999; font-size:.83rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .track .dur { color:#888; font-size:.8rem; flex:none; }
  .icon-btn { flex:none; width:38px; height:38px; border-radius:50%; border:1px solid #d4af37; background:transparent; color:#f5e08c; font-size:1.15rem; cursor:pointer; font-family:inherit; line-height:1; }
  .icon-btn.red { border-color:#a33; color:#ff9c9c; }
  .pl-card { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#0b0b0b; border:1px solid #2c2c2c; border-radius:13px; padding:14px; margin-top:9px; cursor:pointer; font-family:inherit; color:#eee; }
  .pl-card .meta { flex:1; }
  .pl-card .tt { color:#fff; font-weight:bold; }
  .pl-card .ar { color:#999; font-size:.83rem; margin-top:2px; }
  .empty { color:#777; margin-top:22px; line-height:1.6; font-size:.92rem; }
  /* player */
  .player { position:fixed; left:0; right:0; bottom:0; background:rgba(8,8,8,.97); border-top:1px solid #d4af37; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); z-index:50; }
  .player .row { max-width:560px; margin:0 auto; display:flex; align-items:center; gap:11px; }
  .player img { width:50px; height:50px; border-radius:8px; object-fit:cover; background:#222; flex:none; }
  .player .meta { flex:1; min-width:0; text-align:left; }
  .player .tt { color:#fff; font-weight:bold; font-size:.94rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player .ar { color:#999; font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pbtn { flex:none; width:42px; height:42px; border-radius:50%; border:1px solid #555; background:#151515; color:#fff; font-size:1.05rem; cursor:pointer; }
  .pbtn.main { width:52px; height:52px; background:linear-gradient(90deg,#d4af37,#f5e08c); color:#111; border:none; font-size:1.3rem; font-weight:bold; }
  .prog { max-width:560px; margin:10px auto 0; display:flex; align-items:center; gap:9px; color:#888; font-size:.75rem; }
  .bar { flex:1; height:6px; border-radius:3px; background:#2c2c2c; cursor:pointer; position:relative; }
  .bar .fill { position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:3px; background:linear-gradient(90deg,#d4af37,#f5e08c); }
  /* modal playlist */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.78); display:none; align-items:flex-end; justify-content:center; z-index:80; }
  .modal.open { display:flex; }
  .sheet { background:#111; border:1px solid #d4af37; border-bottom:none; border-radius:18px 18px 0 0; width:100%; max-width:560px; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); text-align:left; max-height:75vh; overflow:auto; }
  .sheet h3 { color:#fff; font-size:1.05rem; margin-bottom:6px; }
  .sheet .opt { display:block; width:100%; text-align:left; background:#0b0b0b; border:1px solid #333; color:#eee; border-radius:11px; padding:13px; margin-top:9px; font-family:inherit; font-size:.95rem; cursor:pointer; }
  .sheet .opt.gold { border-color:#d4af37; color:#f5e08c; font-weight:bold; }
  .back { display:inline-block; margin-top:26px; color:#d4af37; text-decoration:none; }
  footer { color:#555; font-size:.78rem; padding:22px 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 4ever Musik</h1>
  <div class="sub">PUTAR MUSIK GRATIS • TANPA IKLAN</div>
  <p class="note">cari lagu, putar full, bikin playlistmu sendiri.<br>playlist tersimpan di HP ini (browser ini).</p>

  <div class="search">
    <input id="q" type="search" placeholder="cari judul lagu / artis…" enterkeyhint="search">
    <button class="btn" id="searchBtn">Cari</button>
  </div>

  <div class="tabs">
    <button class="tab on" id="tabTrend">🔥 Trending</button>
    <button class="tab" id="tabIndo">🇮🇩 Lagu Indo</button>
    <button class="tab" id="tabPl">🎵 Playlist</button>
  </div>

  <div id="trendChips" class="chips" style="margin-top:14px">
    <button class="chip on" data-genre="">🌟 Semua</button>
    <button class="chip" data-genre="Pop">🎤 Pop</button>
    <button class="chip" data-genre="Hip-Hop/Rap">🎙️ Hip-Hop</button>
    <button class="chip" data-genre="Electronic">🎛️ Elektronik</button>
    <button class="chip" data-genre="Rock">🎸 Rock</button>
    <button class="chip" data-genre="Alternative">🌙 Alternatif</button>
    <button class="chip" data-genre="R&B/Soul">💜 R&amp;B / Soul</button>
    <button class="chip" data-genre="Latin">💃 Latin</button>
    <button class="chip" data-genre="Jazz">🎷 Jazz</button>
    <button class="chip" data-genre="Metal">🤘 Metal</button>
    <button class="chip" id="chipTiktok">📱 Viral TikTok</button>
  </div>
  <div id="listArea"></div>
  <div id="indoArea" style="display:none">
    <div class="chips">
      <button class="chip on" data-indo="all">🌟 Semua Indo</button>
      <button class="chip" data-indo="dangdut">🎤 Dangdut &amp; Koplo</button>
      <button class="chip" data-indo="pop">🎧 Pop &amp; Cover</button>
      <button class="chip" data-indo="daerah">🪘 Lagu Daerah</button>
      <button class="chip" data-indo="hiphop">🎙️ Hip-Hop Indo</button>
    </div>
    <div id="indoList"></div>
  </div>
  <div id="plArea" style="display:none"></div>

  <a class="back" href="https://4ever.ai.id/index.html">← kembali ke 4ever.ai.id</a>
  <footer>© 2026 4ever.ai.id — musik dari Audius, platform artis independen</footer>
</div>

<div class="player" id="playerBar" style="display:none">
  <div class="row">
    <img id="pArt" alt="">
    <div class="meta">
      <div class="tt" id="pTitle">—</div>
      <div class="ar" id="pArtist">—</div>
    </div>
    <button class="pbtn" id="prevBtn">⏮</button>
    <button class="pbtn main" id="playBtn">▶</button>
    <button class="pbtn" id="nextBtn">⏭</button>
  </div>
  <div class="prog">
    <span id="tNow">0:00</span>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <span id="tEnd">0:00</span>
  </div>
</div>

<div class="modal" id="sheetWrap">
  <div class="sheet">
    <h3 id="sheetTitle">Tambah ke playlist</h3>
    <div id="sheetOpts"></div>
    <button class="opt" id="sheetCancel">Batal</button>
  </div>
</div>

<audio id="au" preload="metadata"></audio>

<script>
const API = 'https://api.audius.co/v1';
const APP = 'app_name=4ever';
const au = document.getElementById('au');
const listArea = document.getElementById('listArea');
const plArea = document.getElementById('plArea');
let queue = [];
let curIdx = -1;
let curTrack = null;
let pendingTrack = null;
let openPlIdx = -1;

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = t => ({ id: t.id, title: t.title || '(tanpa judul)', artist: (t.user && t.user.name) || '', dur: t.duration || 0, art: (t.artwork && (t.artwork['150x150'] || t.artwork['480x480'])) || '' });
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }

const LS = 'musik_playlists_v1';
function loadPls() { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch (e) { return []; } }
function savePls(p) { try { localStorage.setItem(LS, JSON.stringify(p)); } catch (e) {} }

/* render daftar lagu ke elemen target; onRowClick menangani klik baris */
function renderTracks(tracks, mode, target, onRowClick) {
  if (!tracks.length) { target.innerHTML = '<p class="empty">belum ada lagu di sini.</p>'; return; }
  target.innerHTML = tracks.map((t, i) =>
    '<div class="track' + (curTrack && curTrack.id === t.id ? ' playing' : '') + '" data-i="' + i + '">' +
    '<img src="' + esc(t.art) + '" alt="" loading="lazy">' +
    '<div class="meta"><div class="tt">' + esc(t.title) + '</div><div class="ar">' + esc(t.artist) + '</div></div>' +
    '<span class="dur">' + fmt(t.dur) + '</span>' +
    (mode === 'pl'
      ? '<button class="icon-btn red" data-del="' + i + '" title="hapus dari playlist">×</button>'
      : '<button class="icon-btn" data-add="' + i + '" title="tambah ke playlist">+</button>') +
    '</div>').join('');
  target.querySelectorAll('.track').forEach(row => {
    row.addEventListener('click', e => {
      const i = +row.getAttribute('data-i');
      if (e.target.tagName === 'BUTTON') {
        if (e.target.hasAttribute('data-add')) { openSheet(tracks[i]); return; }
        if (e.target.hasAttribute('data-del')) { delFromPl(i); return; }
      }
      onRowClick(tracks, i);
    });
  });
}
const playFrom = (tracks, i) => { queue = tracks; playIdx(i); };

function playIdx(i) {
  if (i < 0 || i >= queue.length) return;
  curIdx = i; curTrack = queue[i];
  au.src = API + '/tracks/' + curTrack.id + '/stream?' + APP;
  au.play().catch(() => {});
  document.getElementById('playerBar').style.display = 'block';
  document.getElementById('pArt').src = curTrack.art || '';
  document.getElementById('pTitle').textContent = curTrack.title;
  document.getElementById('pArtist').textContent = curTrack.artist;
  document.getElementById('tEnd').textContent = fmt(curTrack.dur);
  document.querySelectorAll('.track').forEach(r => {
    const list = r.closest('#listArea') ? queue : queue;
    r.classList.toggle('playing', curTrack && r.querySelector('.tt') && r.querySelector('.tt').textContent === curTrack.title);
  });
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: curTrack.title, artist: curTrack.artist, artwork: curTrack.art ? [{ src: curTrack.art, sizes: '150x150' }] : [] });
      navigator.mediaSession.setActionHandler('previoustrack', () => playIdx(curIdx - 1));
      navigator.mediaSession.setActionHandler('nexttrack', () => playIdx(curIdx + 1));
    } catch (e) {}
  }
}
const playBtn = document.getElementById('playBtn');
au.addEventListener('play', () => playBtn.textContent = '⏸');
au.addEventListener('pause', () => playBtn.textContent = '▶');
au.addEventListener('ended', () => { if (curIdx + 1 < queue.length) playIdx(curIdx + 1); });
au.addEventListener('timeupdate', () => {
  document.getElementById('tNow').textContent = fmt(au.currentTime);
  if (au.duration) document.getElementById('fill').style.width = (au.currentTime / au.duration * 100) + '%';
});
playBtn.onclick = () => { if (!curTrack) return; if (au.paused) au.play().catch(() => {}); else au.pause(); };
document.getElementById('nextBtn').onclick = () => playIdx(curIdx + 1);
document.getElementById('prevBtn').onclick = () => playIdx(curIdx - 1);
document.getElementById('bar').addEventListener('click', e => {
  if (!au.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  au.currentTime = (e.clientX - r.left) / r.width * au.duration;
});

async function loadTrending(genre) {
  document.querySelectorAll('[data-genre]').forEach(c => c.classList.toggle('on', c.getAttribute('data-genre') === (genre || '')));
  document.getElementById('chipTiktok').classList.remove('on');
  listArea.innerHTML = '<p class="empty">⏳ lagi ngambil lagu trending…</p>';
  try {
    const g = genre ? '&genre=' + encodeURIComponent(genre) : '';
    const j = await getJSON(API + '/tracks/trending?limit=30' + g + '&' + APP);
    const tr = (j.data || []).map(norm);
    if (!tr.length) { listArea.innerHTML = '<p class="empty">genre ini lagi kosong. coba genre lain ya.</p>'; return; }
    renderTracks(tr, 'lib', listArea, playFrom);
  } catch (e) { listArea.innerHTML = '<p class="empty">❌ gagal ngambil data. cek koneksi internetnya ya.</p>'; }
}
document.querySelectorAll('[data-genre]').forEach(c => c.addEventListener('click', () => { switchTab('trend'); loadTrending(c.getAttribute('data-genre')); }));

/* ---------- menu viral tiktok ---------- */
async function loadTiktok() {
  document.querySelectorAll('[data-genre]').forEach(c => c.classList.remove('on'));
  document.getElementById('chipTiktok').classList.add('on');
  listArea.innerHTML = '<p class="empty">⏳ lagi ngumpulin lagu viral TikTok…</p>';
  try {
    const seen = new Set(); const out = [];
    for (const q of ['tiktok', 'tiktok remix', 'viral tiktok']) {
      const j = await getJSON(API + '/tracks/search?query=' + encodeURIComponent(q) + '&limit=12&' + APP);
      for (const t of (j.data || [])) { if (!seen.has(t.id)) { seen.add(t.id); out.push(norm(t)); } }
    }
    if (!out.length) { listArea.innerHTML = '<p class="empty">lagi kosong. coba lagi nanti ya.</p>'; return; }
    renderTracks(out.slice(0, 36), 'lib', listArea, playFrom);
  } catch (e) { listArea.innerHTML = '<p class="empty">❌ gagal ngambil data. cek koneksi internetnya ya.</p>'; }
}
document.getElementById('chipTiktok').addEventListener('click', () => { switchTab('trend'); loadTiktok(); });
async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) { loadTrending(); return; }
  switchTab('trend');
  listArea.innerHTML = '<p class="empty">⏳ lagi nyari…</p>';
  try {
    const j = await getJSON(API + '/tracks/search?query=' + encodeURIComponent(q) + '&limit=30&' + APP);
    const tr = (j.data || []).map(norm);
    if (!tr.length) { listArea.innerHTML = '<p class="empty">nggak ada lagu yang ketemu.<br>coba kata kunci lain ya.</p>'; return; }
    renderTracks(tr, 'lib', listArea, playFrom);
  } catch (e) { listArea.innerHTML = '<p class="empty">❌ gagal nyari. cek koneksi internetnya ya.</p>'; }
}
document.getElementById('searchBtn').onclick = doSearch;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

function switchTab(which) {
  document.getElementById('tabTrend').classList.toggle('on', which === 'trend');
  document.getElementById('tabIndo').classList.toggle('on', which === 'indo');
  document.getElementById('tabPl').classList.toggle('on', which === 'pl');
  listArea.style.display = which === 'trend' ? 'block' : 'none';
  document.getElementById('trendChips').style.display = which === 'trend' ? 'flex' : 'none';
  document.getElementById('indoArea').style.display = which === 'indo' ? 'block' : 'none';
  plArea.style.display = which === 'pl' ? 'block' : 'none';
  if (which === 'pl') renderPls();
  if (which === 'indo' && !indoLoaded) loadIndo('all');
}
document.getElementById('tabTrend').onclick = () => switchTab('trend');
document.getElementById('tabIndo').onclick = () => switchTab('indo');
document.getElementById('tabPl').onclick = () => switchTab('pl');

/* ---------- menu lagu indo ---------- */
const INDO_Q = {
  all: ['indonesia', 'dangdut', 'koplo'],
  dangdut: ['dangdut', 'koplo'],
  pop: ['indonesia', 'indonesian'],
  daerah: ['lagu daerah', 'saluang minang', 'jawa'],
  hiphop: ['indonesian hiphop', 'rap indonesia']
};
let indoLoaded = false;
async function loadIndo(cat) {
  indoLoaded = true;
  document.querySelectorAll('[data-indo]').forEach(c => c.classList.toggle('on', c.getAttribute('data-indo') === cat));
  const box = document.getElementById('indoList');
  box.innerHTML = '<p class="empty">⏳ lagi ngumpulin lagu Indo…</p>';
  try {
    const seen = new Set(); const out = [];
    for (const q of INDO_Q[cat]) {
      const j = await getJSON(API + '/tracks/search?query=' + encodeURIComponent(q) + '&limit=15&' + APP);
      for (const t of (j.data || [])) { if (!seen.has(t.id)) { seen.add(t.id); out.push(norm(t)); } }
    }
    if (!out.length) { box.innerHTML = '<p class="empty">kategori ini lagi kosong. coba kategori lain ya.</p>'; return; }
    renderTracks(out.slice(0, 40), 'lib', box, playFrom);
  } catch (e) { box.innerHTML = '<p class="empty">❌ gagal ngambil data. cek koneksi internetnya ya.</p>'; }
}
document.querySelectorAll('[data-indo]').forEach(c => c.addEventListener('click', () => loadIndo(c.getAttribute('data-indo'))));

function renderPls() {
  const pls = loadPls();
  let h = '<button class="btn" id="newPl" style="width:100%;margin-top:18px">+ Buat Playlist Baru</button>';
  if (!pls.length) h += '<p class="empty">belum ada playlist.<br>bikin baru, terus tambahin lagu pakai tombol + di tiap lagu.</p>';
  pls.forEach((p, i) => {
    h += '<div class="pl-card" data-pl="' + i + '"><div class="meta"><div class="tt">🎵 ' + esc(p.name) + '</div><div class="ar">' + p.tracks.length + ' lagu — pencet buat buka</div></div>' +
      '<button class="icon-btn red" data-delpl="' + i + '" title="hapus playlist">×</button></div>';
    if (i === openPlIdx) h += '<div id="openPlTracks"></div>';
  });
  plArea.innerHTML = h;
  document.getElementById('newPl').onclick = () => {
    const name = prompt('nama playlist-nya apa?');
    if (!name || !name.trim()) return;
    const pls2 = loadPls(); pls2.push({ name: name.trim(), tracks: [] }); savePls(pls2); renderPls();
  };
  plArea.querySelectorAll('[data-pl]').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.tagName === 'BUTTON' && e.target.hasAttribute('data-delpl')) {
        if (confirm('hapus playlist ini?')) { const pls2 = loadPls(); pls2.splice(+e.target.getAttribute('data-delpl'), 1); savePls(pls2); openPlIdx = -1; renderPls(); }
        return;
      }
      const i = +card.getAttribute('data-pl');
      openPlIdx = (openPlIdx === i) ? -1 : i;
      renderPls();
    });
  });
  if (openPlIdx >= 0 && pls[openPlIdx]) {
    const holder = document.getElementById('openPlTracks');
    if (holder) renderTracks(pls[openPlIdx].tracks, 'pl', holder, playFrom);
  }
}
function delFromPl(i) {
  const pls = loadPls();
  if (openPlIdx < 0 || !pls[openPlIdx]) return;
  pls[openPlIdx].tracks.splice(i, 1); savePls(pls); renderPls();
}

const sheet = document.getElementById('sheetWrap');
function openSheet(track) {
  pendingTrack = track;
  const pls = loadPls();
  const opts = document.getElementById('sheetOpts');
  opts.innerHTML = pls.map((p, i) => '<button class="opt" data-pladd="' + i + '">🎵 ' + esc(p.name) + ' <span style="color:#888">(' + p.tracks.length + ' lagu)</span></button>').join('') +
    '<button class="opt gold" id="sheetNew">+ Playlist Baru</button>';
  opts.querySelectorAll('[data-pladd]').forEach(b => b.onclick = () => {
    const pls2 = loadPls(); const p = pls2[+b.getAttribute('data-pladd')];
    if (!p.tracks.some(t => t.id === pendingTrack.id)) p.tracks.push(pendingTrack);
    savePls(pls2); closeSheet();
    alert('masuk ke playlist "' + p.name + '" ✅');
  });
  document.getElementById('sheetNew').onclick = () => {
    const name = prompt('nama playlist-nya apa?');
    if (!name || !name.trim()) return;
    const pls2 = loadPls(); pls2.push({ name: name.trim(), tracks: [pendingTrack] }); savePls(pls2); closeSheet();
  };
  sheet.classList.add('open');
}
function closeSheet() { sheet.classList.remove('open'); pendingTrack = null; }
document.getElementById('sheetCancel').onclick = closeSheet;
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

loadTrending();
</script>
</body>
</html>
