<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy — Game Afis &amp; Dita</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: #ffffff; color: #222; padding-bottom: 40px; }
  .topbar { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid #eee; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .topbar-in { max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:10px 16px; }
  .tb-logo { font-weight:900; font-size:1rem; letter-spacing:.02em; text-decoration:none; background-image:linear-gradient(90deg,#e53935,#f9a825,#43a047); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; flex:none; }
  .topbar nav { margin-left:auto; display:flex; gap:14px; overflow-x:auto; scrollbar-width:none; }
  .topbar nav::-webkit-scrollbar { display:none; }
  .topbar nav a { color:#666; text-decoration:none; font-size:.83rem; font-weight:600; white-space:nowrap; }
  .topbar nav a:hover { color:#111; }
  .topbar nav a.on { color:#e53935; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; text-align: center; }
  .back { display: inline-block; margin: 4px 0 10px; color: #e53935; text-decoration: none; font-weight: 700; font-size: 14px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 14px; }
  .stats { display: flex; justify-content: center; gap: 12px; margin-bottom: 12px; }
  .stat { background: #fff8e1; border: 1px solid #ffe082; border-radius: 12px; padding: 8px 16px; font-size: 14px; }
  .stat b { color: #e53935; font-size: 18px; }
  canvas { background: #e3f2fd; border: 2px solid #0288d1; border-radius: 14px; width: 100%; max-width: 400px; height: auto; display: block; margin: 0 auto; touch-action: none; cursor: pointer; }
  .btn { font-size: 15px; padding: 11px 20px; border: none; border-radius: 999px; cursor: pointer; font-weight: 700; background: #e53935; color: #fff; margin-top: 12px; }
  #msg { font-size: 17px; font-weight: 700; margin: 12px 0 4px; min-height: 24px; }
  .hint { font-size: 12.5px; color: #888; }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <a class="tb-logo" href="https://4ever.ai.id/">4EVER</a>
  <nav>
    <a href="https://4ever.ai.id/">Beranda</a>
    <a href="https://4ever.ai.id/profil.html">Profil</a>
    <a href="https://4ever.ai.id/musik-yt.html">Musik</a>
    <a href="https://4ever.ai.id/tools.html">Tools</a>
    <a href="https://4ever.ai.id/artikel.html">Artikel</a>
    <a href="https://4ever.ai.id/tv-gratis.html">TV</a>
    <a href="https://4ever.ai.id/berita.html">Berita</a>
    <a href="https://4ever.ai.id/game-hub-afis-dita.html" class="on">Game</a>
  </nav>
</div></div>

<div class="wrap">
  <a class="back" href="game-hub-afis-dita.html">⬅ Kembali ke Hub</a>
  <h1>🐤 Flappy</h1>
  <p class="sub">Ketuk layar biar burungnya terbang. Lewati pipanya, jangan sampai jatuh atau nabrak!</p>
  <div class="stats">
    <div class="stat">Skor<br><b id="skor">0</b></div>
    <div class="stat">Terbaik<br><b id="terbaik">0</b></div>
  </div>
  <canvas id="cv" width="400" height="500"></canvas>
  <div id="msg">Ketuk layar / tekan spasi untuk mulai!</div>
  <button class="btn" id="btnMulai">▶ Mulai</button>
  <p class="hint">Ketuk, klik, atau tekan spasi untuk mengepak.</p>
</div>

<script>
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = 400, H = 500;
let burung, pipa, skor, jalan = false, raf = null, frame = 0;
let terbaik = 0;
try { terbaik = parseInt(localStorage.getItem("flappy-terbaik") || "0", 10) || 0; } catch (e) {}
document.getElementById("terbaik").textContent = terbaik;

function reset() {
  burung = { x: 80, y: 220, v: 0, r: 16 };
  pipa = [];
  skor = 0; frame = 0;
  document.getElementById("skor").textContent = "0";
  gambar();
}
function gambar() {
  ctx.fillStyle = "#e3f2fd"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#81c784";
  ctx.fillRect(0, H - 30, W, 30);
  ctx.fillStyle = "#43a047";
  pipa.forEach(p => {
    ctx.fillRect(p.x, 0, 64, p.atas);
    ctx.fillRect(p.x, p.atas + 150, 64, H - 30 - (p.atas + 150));
    ctx.fillStyle = "#2e7d32";
    ctx.fillRect(p.x - 3, p.atas - 18, 70, 18);
    ctx.fillRect(p.x - 3, p.atas + 150, 70, 18);
    ctx.fillStyle = "#43a047";
  });
  ctx.fillStyle = "#f9a825";
  ctx.beginPath(); ctx.arc(burung.x, burung.y, burung.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(burung.x + 6, burung.y - 5, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.arc(burung.x + 8, burung.y - 5, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#e53935";
  ctx.beginPath(); ctx.moveTo(burung.x + burung.r - 2, burung.y); ctx.lineTo(burung.x + burung.r + 10, burung.y + 4); ctx.lineTo(burung.x + burung.r - 2, burung.y + 8); ctx.fill();
}
function loop() {
  if (!jalan) return;
  frame++;
  burung.v += 0.45;
  burung.y += burung.v;
  if (frame % 95 === 0) {
    const atas = 60 + Math.random() * (H - 30 - 150 - 120);
    pipa.push({ x: W, atas, lewat: false });
  }
  pipa.forEach(p => {
    p.x -= 2.6;
    if (!p.lewat && p.x + 64 < burung.x) { p.lewat = true; skor++; document.getElementById("skor").textContent = skor; }
  });
  pipa = pipa.filter(p => p.x > -70);
  const kenaPipa = pipa.some(p =>
    burung.x + burung.r > p.x && burung.x - burung.r < p.x + 64 &&
    (burung.y - burung.r < p.atas || burung.y + burung.r > p.atas + 150));
  if (burung.y + burung.r >= H - 30 || burung.y - burung.r <= 0 || kenaPipa) { gameOver(); return; }
  gambar();
  raf = requestAnimationFrame(loop);
}
function kepak() {
  if (!jalan) { mulai(); return; }
  burung.v = -7.5;
}
function mulai() {
  cancelAnimationFrame(raf);
  reset();
  jalan = true;
  document.getElementById("msg").textContent = "Terbang! 🐤";
  document.getElementById("btnMulai").textContent = "🔄 Main Lagi";
  burung.v = -7.5;
  raf = requestAnimationFrame(loop);
}
function gameOver() {
  jalan = false; cancelAnimationFrame(raf);
  if (skor > terbaik) {
    terbaik = skor;
    document.getElementById("terbaik").textContent = terbaik;
    try { localStorage.setItem("flappy-terbaik", String(terbaik)); } catch (e) {}
    document.getElementById("msg").textContent = "💥 Jatuh! Skor " + skor + " — Rekor baru! 🎉";
  } else {
    document.getElementById("msg").textContent = "💥 Jatuh! Skor kamu " + skor + ".";
  }
  document.getElementById("btnMulai").textContent = "🔄 Main Lagi";
}
cv.addEventListener("pointerdown", e => { kepak(); e.preventDefault(); });
document.getElementById("btnMulai").onclick = mulai;
document.addEventListener("keydown", e => {
  if (e.code === "Space") { kepak(); e.preventDefault(); }
});
reset();
</script>
</body>
</html>
